<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Repro: Guru collections cache poisoning</title></head>
<body>
<h1>Guru collections poisoned-cache repro</h1>
<pre id="out">running…</pre>
<iframe id="stage" style="width:380px;height:520px;border:1px solid #ccc" src="about:blank"></iframe>
<script>
const CFG = { settings: { guru_reason_field: "26000", guru_auth: "dGVzdA==" },
              fields: { "26000": "ELIGIBILITY_DISPUTE" }, ticketId: 12345 };
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function boot() {
  const stage = document.getElementById("stage");
  await new Promise(res => { stage.onload = res;
    stage.src = "apptest.html?cfg=" + encodeURIComponent(JSON.stringify(CFG)) + "&r=" + Math.random(); });
  const W = stage.contentWindow;
  const t0 = performance.now();
  while (!(W.__appLoaded && W.__mock)) {
    if (performance.now() - t0 > 6000) throw new Error("app did not boot");
    await sleep(25);
  }
  await sleep(250); // metadata settle (guruCfg read)
  return W;
}
function armSuccess(M) {
  M.behaviors.push({ match: r => /\/collections$/.test(r.url),
    respond: () => Promise.resolve({ collections: [{ id: "col-1", name: "CX Playbooks" }, { id: "col-2", name: "Billing" }] }) });
}
const collCalls = M => M.requests.filter(r => /\/collections$/.test(r.url)).map(r => r.outcome);

(async function () {
  const R = {};
  try {
    // ── Phase A: transient blip on first Guru open ─────────────────────
    let W = await boot(); let M = W.__mock; const D = () => W.document;
    M.failNext(r => /\/collections$/.test(r.url), 1);  // ONE transient failure
    armSuccess(M);                                     // every later call would succeed
    D().querySelector('.tab[data-pane="guru"]').click(); await sleep(150);
    D().querySelector('#guru-subtabs .subtab[data-gsub="browse"]').click(); await sleep(150);
    R.A_afterBlip = { collectionsCalls: collCalls(M),
      browseBody: D().getElementById("guru-browse-body").textContent.trim(),
      filterOptions: [...D().getElementById("guru-collection-filter").options].map(o => o.textContent) };

    // ── Phase B: every in-app recovery path ────────────────────────────
    D().querySelector('#guru-subtabs .subtab[data-gsub="suggested"]').click(); await sleep(80);
    D().querySelector('#guru-subtabs .subtab[data-gsub="browse"]').click(); await sleep(150);
    R.B1_subtabRoundtrip = { collectionsCalls: collCalls(M), browseBody: D().getElementById("guru-browse-body").textContent.trim() };

    const crumb = D().querySelector('[data-guru-crumb="0"]');
    if (crumb) { crumb.disabled = false; crumb.click(); } await sleep(150);
    R.B2_crumbRoot = { crumbFound: !!crumb, collectionsCalls: collCalls(M), browseBody: D().getElementById("guru-browse-body").textContent.trim() };

    const grf = D().getElementById("guru-refresh"); if (grf) grf.click(); await sleep(200);
    R.B3_suggestedRefresh = { refreshBtnExists: !!grf, collectionsCalls: collCalls(M) };

    D().querySelector('.tab[data-pane="slack"]').click(); await sleep(80);
    D().querySelector('.tab[data-pane="guru"]').click(); await sleep(150);
    D().querySelector('#guru-subtabs .subtab[data-gsub="browse"]').click(); await sleep(150);
    R.B4_mainTabRoundtrip = { collectionsCalls: collCalls(M),
      browseBody: D().getElementById("guru-browse-body").textContent.trim(),
      filterOptions: [...D().getElementById("guru-collection-filter").options].map(o => o.textContent) };

    // ── Phase C: full iframe reload, no blip → proves failure was transient ──
    W = await boot(); M = W.__mock;
    armSuccess(M);
    W.document.querySelector('.tab[data-pane="guru"]').click(); await sleep(150);
    W.document.querySelector('#guru-subtabs .subtab[data-gsub="browse"]').click(); await sleep(150);
    R.C_freshIframeNoBlip = { collectionsCalls: collCalls(M),
      browseBody: W.document.getElementById("guru-browse-body").textContent.trim(),
      filterOptions: [...W.document.getElementById("guru-collection-filter").options].map(o => o.textContent) };

    R.done = true;
  } catch (e) { R.error = String(e && e.stack || e); }
  window.__RESULTS = R;
  document.getElementById("out").textContent = JSON.stringify(R, null, 2);
})();
</script>
</body>
</html>
