  window.__xss = [];

  // ---- exact copy of safeGuruContent from app.js:2263-2270 ----
  function safeGuruContent(html) {
    var d = document.createElement("div"); d.innerHTML = String(html || "");
    Array.prototype.forEach.call(d.querySelectorAll("script,style,iframe,object,embed,link"), function (n) { n.parentNode && n.parentNode.removeChild(n); });
    Array.prototype.forEach.call(d.querySelectorAll("*"), function (n) {
      Array.prototype.slice.call(n.attributes).forEach(function (a) { if (/^on/i.test(a.name) || (a.name === "href" && /^javascript:/i.test(a.value))) n.removeAttribute(a.name); });
    });
    return d.innerHTML;
  }

  // ---- hostile Guru card bodies (what a compromised/malicious card would contain) ----

    "C0 control href":     '<a id="p3" href="&#1;javascript:window.__xss.push(\'p3\')">click</a>',
    "svg xlink:href":      '<svg><a id="p4" xlink:href="javascript:window.__xss.push(\'p4\')"><text>click</text></a></svg>',
    "plain (control)":     '<a id="p5" href="javascript:window.__xss.push(\'p5\')">click</a>'

      log("EXECUTED payloads: " + JSON.stringify(window.__xss));
